name: Train and evaluate MNIST
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "训练轮数"
        required: true
        default: "5"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Train on MNIST
        env:
          TRAIN_EPOCHS: ${{ inputs.epochs }}
        run: python train.py --epochs "$TRAIN_EPOCHS"
      - name: Evaluate independent test set
        run: python test.py
      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: mnist-model-and-reports
          path: |
            weights/mnist_cnn_best.pth
            results/history.csv
            results/test_metrics.json
          if-no-files-found: error
